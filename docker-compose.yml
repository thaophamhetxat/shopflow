# File này định nghĩa hạ tầng cốt lõi của ShopFlow ở Day 38: PostgreSQL, Redis và RabbitMQ.
# Jaeger được thêm ở Day 64; Prometheus và Grafana được bổ sung ở Day 65 mà không đổi các service đã có.
# Cấu hình này phục vụ local development: các service chạy bằng Docker, app .NET chạy bằng dotnet run trên máy.
services:
  postgres:
    # Chọn PostgreSQL 16 alpine vì lịch Day 38/42/50/65 chốt là PostgreSQL và EF Core 8, không dùng SQL Server.
    image: postgres:16-alpine
    # Thiết lập tài khoản local dành cho bài tập, không dùng cho production.
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: ShopFlow123!
      POSTGRES_DB: shopflow_order
    # Mở cổng 5432 để app .NET local và pgAdmin kết nối vào Postgres trên máy chủ.
    ports:
      - "5432:5432"
    # Volume này lưu dữ liệu Postgres trên máy host để không mất dữ liệu khi container khởi động lại.
    volumes:
      - shopflow_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    # Health check kiểm tra database order sẵn sàng trước khi app dùng hoặc khi kiểm tra docker compose ps.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow_order"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Restart tự động nếu container dừng đột ngột trong môi trường local để thuận tiện phát triển.
    restart: unless-stopped

  redis:
    # Chọn Redis 7 alpine vì cache/message broker local cho architecture thực hiện ở các day sau.
    image: redis:7-alpine
    # Mở cổng 6379 để app .NET và tool local truy cập Redis trên máy host.
    ports:
      - "6379:6379"
    # Volume lưu dữ liệu Redis để giữ cache và trạng thái khi container được reset.
    volumes:
      - shopflow_redis_data:/data
    # Health check ping xác nhận Redis còn sống và phản hồi command đúng cách.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Restart nếu dịch vụ tắt nên hệ thống vẫn giữ khả năng chạy lại tự động.
    restart: unless-stopped

  rabbitmq:
    # Chọn RabbitMQ management alpine vì Day 38 cần infra để tương lai Event Bus/Outbox chạy đúng chuẩn.
    image: rabbitmq:3-management-alpine
    # Mở cổng AMQP 5672 để app .NET gửi/nhận message và cổng UI 15672 để quản trị local.
    ports:
      - "5672:5672"
      - "15672:15672"
    # Volume lưu dữ liệu RabbitMQ để dữ liệu queue và user được giữ qua restart container.
    volumes:
      - shopflow_rabbitmq_data:/var/lib/rabbitmq
    # Health check xác nhận broker cho phép nhận message và sẵn sàng xử lý queue ở local.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Restart nếu RabbitMQ báo lỗi để không ngắt quá trình development cục bộ.
    restart: unless-stopped

  jaeger:
    # Jaeger all-in-one phục vụ Day 64 cho export span OTLP từ 3 API local chạy bằng dotnet run trên host.
    image: jaegertracing/all-in-one:latest
    container_name: shopflow-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  shopflow-gateway:
    # Gateway YARP này chỉ cần port 5000 cho client và không giữ database hay state trong container.
    build:
      context: .
      dockerfile: src/Gateway/ShopFlow.Gateway/Dockerfile
    # Container này được đặt tên rõ ràng để dễ dừng hoặc kiểm tra khi smoke test Day 49 chạy.
    container_name: shopflow-gateway
    # Mở cổng 5000 duy nhất cho client gọi qua gateway thay vì gọi từng service trực tiếp.
    ports:
      - "5000:5000"
    # Environment này cấu hình ASP.NET Core chạy ở 5000 và override cluster destination sang localhost host machine.
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ReverseProxy__Clusters__ordersCluster__Destinations__orders1__Address=http://host.docker.internal:5181
      - ReverseProxy__Clusters__inventoryCluster__Destinations__inventory1__Address=http://host.docker.internal:5140
      - ReverseProxy__Clusters__paymentsCluster__Destinations__payments1__Address=http://host.docker.internal:5199
    # Extra hosts cần thiết vì localhost trong container là chính bản thân gateway, không phải máy host chạy API local.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Không đặt depends_on vì Day 49 không có 3 API trong compose; gateway chỉ proxy đến process local đã chạy ngoài compose.
    restart: unless-stopped

  prometheus:
    # Prometheus scrape metric từ bốn API local và chính nó để cung cấp nguồn dữ liệu cho dashboard.
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    # Dùng cùng host-gateway pattern của Gateway để container truy cập API chạy trên Windows host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    # Grafana local dùng Prometheus datasource và dashboard provisioning đã version-control.
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  shopflow_postgres_data:
  shopflow_redis_data:
  shopflow_rabbitmq_data: